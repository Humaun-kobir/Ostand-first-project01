<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Humaun Kobir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #007bff;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .title {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .bio {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .contact-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            margin-bottom: 25px;
        }

        .contact-info a {
            color: #007bff;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Picture linked from your files -->
        <div class="profile-img-container">
            <img src="picture.png" alt="Humaun Kobir Profile Picture">
        </div>

        <h1>Humaun Kobir</h1>
        <div class="title">Developer & Tech Enthusiast</div>

        <p class="bio">
            Hello! I am Humaun Kobir. Welcome to my personal portfolio website. I am passionate about coding, learning new technologies, and building projects.
        </p>

        <div class="contact-info">
            📧 Email: <a href="mailto:hk36163@gmail.com">hk36163@gmail.com</a>
        </div>

        <div class="social-links">
            <a href="mailto:hk36163@gmail.com" class="btn">Get in Touch</a>
        </div>
    </div>

</body>
</html>
